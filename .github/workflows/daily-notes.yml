name: Daily Notes Page

on:
  schedule:
    # 12:00 UTC = 08:00 EDT (07:00 EST). Adjust cron to preferred local time.
    - cron: "0 12 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: daily-notes
  cancel-in-progress: false

permissions:
  contents: write # needed to push the regenerated HTML back to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build daily notes page
        run: python pipeline/build_daily_notes.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/today.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily notes for $(date -u +%Y-%m-%d)"
          # Retry with rebase on conflict (e.g. weekly workflow pushed at the same time)
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push failed on attempt $i, pulling with rebase and retrying..."
            git pull --rebase origin main
          done
          echo "Push failed after 5 attempts"
          exit 1
