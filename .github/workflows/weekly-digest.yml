name: Weekly Restack Digest Page

on:
  schedule:
    # 22:00 UTC Sunday = 18:00 EDT (17:00 EST) Sunday. Adjust cron for preferred local time.
    - cron: "0 22 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build restack digest page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/build_restack_digest.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/digest.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weekly restack digest for $(date -u +%Y-%m-%d)"
          # Retry with rebase on conflict (e.g. daily workflow pushed at the same time)
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push failed on attempt $i, pulling with rebase and retrying..."
            git pull --rebase origin main
          done
          echo "Push failed after 5 attempts"
          exit 1
